<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="cv-api-base" content="">
<title>Solicitar CV | LANKAMAR</title>
<style>body{font:1rem system-ui;line-height:1.6;max-width:640px;margin:3rem auto;padding:1rem}label{display:block;margin-top:1rem}input[type=email],select,button{font:inherit;padding:.7rem;max-width:100%}input[type=email],select{width:100%;box-sizing:border-box}button{margin-top:1rem}a{color:#922b2b}:focus-visible{outline:3px solid #922b2b;outline-offset:3px}.trap{position:absolute;left:-10000px}</style></head>
<body><main><h1>Solicitar currículum</h1><p>Recibí por correo un enlace de un solo uso, válido durante 30 minutos.</p>
<form id="solicitud-cv">
<label for="email">Correo electrónico *</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="uso">
<label for="version">Versión del currículum *</label><select id="version" name="version" required><option value="">Seleccioná una versión</option><option value="tech">Tecnología e IA aplicada</option><option value="salud">Salud y gestión</option><option value="academico">Académico</option></select>
<input type="hidden" name="privacy_version" value="2026-11-01">
<div class="trap" aria-hidden="true"><label for="website">Sitio web</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<label><input name="consentimiento" type="checkbox" required> Acepto el uso de mis datos para gestionar esta solicitud según el <a href="/privacidad-cv/">aviso de privacidad</a>. *</label>
<p id="uso">No se utilizan los datos para publicidad ni suscripciones.</p>
<button type="submit" disabled>Solicitar enlace por correo</button><p id="estado" role="status" aria-live="polite">Servicio pendiente de habilitación.</p>
<noscript>Este formulario necesita JavaScript. Podés escribir a lankamar@gmail.com.</noscript></form>
<p><a href="/cv">Volver a currículums</a></p></main>
<script>
(()=>{
const form=document.querySelector('form'),button=form.querySelector('button'),status=document.getElementById('estado');
const base=document.querySelector('meta[name="cv-api-base"]').content.replace(/\/$/,'');
const version=new URLSearchParams(location.search).get('version');
if(['tech','salud','academico'].includes(version))form.elements.version.value=version;
if(!base)return;
button.disabled=false;status.textContent='';
form.addEventListener('submit',async event=>{
event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.textContent='Enviando solicitud…';
try{
const response=await fetch(base+'/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.elements.email.value,version:form.elements.version.value,consent:form.elements.consentimiento.checked,privacy_version:form.elements.privacy_version.value,website:form.elements.website.value})});
if(response.status===202){location.assign('/solicitud-cv-recibida/');return;}
status.textContent=response.status===429?'Alcanzaste el límite de solicitudes. Intentá más tarde.':response.status===422?'Revisá el correo, la versión y el consentimiento.':'No pudimos enviar el correo. Intentá más tarde.';
}catch{status.textContent='No pudimos conectar con el servicio. Intentá más tarde.';}finally{button.disabled=false;}
});
})();
</script></body></html>
